name: build
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7, cache-disabled: true }
      - name: Build
        run: |
          unzip -q OptiMoto.zip
          cd OptiMoto
          gradle assembleDebug --console=plain --stacktrace 2>&1 | tee ../build.log || true
          if ! ls app/build/outputs/apk/debug/*.apk; then
            echo "=====ERRORES====="
            grep -nE "^e: |error:|What went wrong|Could not|FAILED" -A6 ../build.log | head -80
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with: { name: OptiMoto-apk, path: OptiMoto/app/build/outputs/apk/debug/*.apk }
