name: build
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7, cache-disabled: true }
      - name: Build
        run: |
          unzip -q OptiMoto.zip
          cd OptiMoto
          if ! gradle assembleDebug --console=plain > ../build.log 2>&1; then
            echo "## ERRORES" >> $GITHUB_STEP_SUMMARY
            grep -E '^e: |What went wrong|Could not|not found|FAILURE' -A4 ../build.log | head -70 >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with: { name: OptiMoto-apk, path: OptiMoto/app/build/outputs/apk/debug/*.apk }
